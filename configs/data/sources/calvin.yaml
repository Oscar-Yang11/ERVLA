      [
        [
          0.0010866472268819618,
          0.010116912302615215,
          -0.008357305846984004,
          -0.002697174228249144,
          0.0009072717644128533,
          -0.0048314784015396645,
          -0.08337152579105851
        ]
      ]
  std:
    action_direct: 
      [
        [
          0.2495469525682764,
          0.20441892719211055,
          0.2120733907408054,
          0.15890847875424444,
          0.1738928823530146,
          0.3548570340866025,
          0.9965185340410228
