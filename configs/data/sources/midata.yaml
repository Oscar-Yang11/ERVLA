midata_mix_ann_pt_v1:
  train_path:
    - data/mds/midata/lego/before_01_11/train/index.json
    - data/mds/midata/lego/0112-0116/train/index.json
    - data/mds/midata/lego/0116-0124/train/index.json
    - data/mds/midata/towel/before_01_11/train/index.json
    - data/mds/midata/towel/0112-0116/train/index.json
    - data/mds/midata/towel/0116-0118/train/index.json
    - data/mds/midata/towel/2026-01-19/train/index.json
    - data/mds/midata/towel/2026-01-20/train/index.json
    - data/mds/midata/towel/2026-01-21/train/index.json
    - data/mds/midata/towel/2026-01-22/train/index.json
    - data/mds/midata/towel/2026-01-23/train/index.json
    - data/mds/midata/towel/2026-01-24/train/index.json
  meta_info: "Dataset: Bi-manual ARX."

  transforms:
    training:
      - type: LoadData
        dataset_action_length: 30
        general_task_prob: 1.0
        subtask_task_prob: 0.0
      - type: Resize
        max_pixels: 90000
        factor: 32
        data_flow:
          media: media
      - type: RandomCrop
        crop_ratio: 0.95
        center_crop: false
        data_flow:
          media: media
      - type: PhotoMetricDistortion
        data_flow:
          media: media
      - type: GetEEActionPos
        reversed_data_flow:
          action_left_ee_pos: [proprios.left_ee_rotm, proprios.left_ee_pos, actions.left_ee_pos]
          action_right_ee_pos: [proprios.right_ee_rotm, proprios.right_ee_pos, actions.right_ee_pos]
      - type: GetEEActionAA
        reversed_data_flow:
          action_left_ee_aa: [proprios.left_ee_rotm, actions.left_ee_rotm]
          action_right_ee_aa: [proprios.right_ee_rotm, actions.right_ee_rotm]
      - type: GetJointAction
        reversed_data_flow:
          action_left_gripper_pos: [proprios.left_gripper_pos, actions.left_gripper_pos]
          action_left_arm_joint: [proprios.left_arm_joint, actions.left_arm_joint]
          action_right_gripper_pos: [proprios.right_gripper_pos, actions.right_gripper_pos]
          action_right_arm_joint: [proprios.right_arm_joint, actions.right_arm_joint]
      - type: GetAbsState
        data_flow:
          proprios.left_gripper_pos: proprio_left_gripper_pos
          proprios.left_arm_joint: proprio_left_arm_joint
          proprios.right_gripper_pos: proprio_right_gripper_pos
          proprios.right_arm_joint: proprio_right_arm_joint
      - type: GetRelState
        data_flow:
          proprios.left_gripper_pos: proprio_left_gripper_pos_v
          proprios.left_arm_joint: proprio_left_arm_joint_v
          proprios.right_gripper_pos: proprio_right_gripper_pos_v
          proprios.right_arm_joint: proprio_right_arm_joint_v
      - type: Normalize
        mode: gaussian
        mean: ${sources.midata_mix_ann_pt_v1.mean_ee}
        std: ${sources.midata_mix_ann_pt_v1.std_ee}
        data_flow:
          action_left_ee_pos: action_left_ee_pos
          action_left_ee_aa: action_left_ee_aa
          action_left_gripper_pos: action_left_gripper_pos
          action_left_arm_joint: action_left_arm_joint
          action_right_ee_pos: action_right_ee_pos
          action_right_ee_aa: action_right_ee_aa
          action_right_gripper_pos: action_right_gripper_pos
          action_right_arm_joint: action_right_arm_joint
      # - type: Normalize
      #   mode: quantile
      #   q01: ${sources.midata_mix_ann_pt_v1.q01}
      #   q99: ${sources.midata_mix_ann_pt_v1.q99}
      #   data_flow:
      #     proprio_left_gripper_pos: proprio_left_gripper_pos
      #     proprio_left_arm_joint: proprio_left_arm_joint
      #     proprio_right_gripper_pos: proprio_right_gripper_pos
      #     proprio_right_arm_joint: proprio_right_arm_joint

