  meta_info: "Dataset: Bi-manual ARX + Mobile Base + Lift. Robot: Dual arm. Camera: Ego camera + 2 x Wrist-mounted camera. Frequency: 30hz."
  transforms:
    training:
      - type: LoadData
        dataset_action_length: 30
        general_task_prob: 1.0
        subtask_task_prob: 0.0
        add_sides_prob: 0.5
      - type: UndistortFisheye
        strength: 0.4
        data_flow:
          media: media
      - type: Resize
        max_pixels: 90000
        factor: 32
        data_flow:
          media: media
      - type: RandomCrop
        crop_ratio: 0.95
        center_crop: false
        data_flow:
          media: media
      - type: PhotoMetricDistortion
        data_flow:
          media: media
      - type: GetEEActionPos
        reversed_data_flow:
          action_left_ee_pos: [proprios.left_ee_rotm, proprios.left_ee_pos, actions.left_ee_pos]
          action_right_ee_pos: [proprios.right_ee_rotm, proprios.right_ee_pos, actions.right_ee_pos]
      - type: GetEEActionAA
        reversed_data_flow:
          action_left_ee_aa: [proprios.left_ee_rotm, actions.left_ee_rotm]
          action_right_ee_aa: [proprios.right_ee_rotm, actions.right_ee_rotm]
      - type: GetJointAction
        reversed_data_flow:
          action_left_gripper_pos: [proprios.left_gripper_pos, actions.left_gripper_pos]
          action_left_arm_joint: [proprios.left_arm_joint, actions.left_arm_joint]
          action_right_gripper_pos: [proprios.right_gripper_pos, actions.right_gripper_pos]
          action_right_arm_joint: [proprios.right_arm_joint, actions.right_arm_joint]
          action_waist_pos: [proprios.waist_pos, actions.waist_pos]
      - type: GetAbsAction
        data_flow:
          actions.base_vel: action_base_vel
      - type: GetAbsState
        data_flow:
          proprios.left_gripper_pos: proprio_left_gripper_pos
          proprios.left_arm_joint: proprio_left_arm_joint
          proprios.right_gripper_pos: proprio_right_gripper_pos
          proprios.right_arm_joint: proprio_right_arm_joint
          proprios.waist_pos: proprio_waist_pos
      - type: Normalize
        mode: gaussian
        mean: ${sources.midata_public_v1.mean}
        std: ${sources.midata_public_v1.std}
        data_flow:
          action_left_ee_pos: action_left_ee_pos_gn
          action_left_ee_aa: action_left_ee_aa_gn
