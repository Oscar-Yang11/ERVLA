# @package _global_

defaults:
  - sources/vlabench_choice


data:
  type: BaseDataModule
  params:
    type: json
    max_steps: ${trainer.max_steps}
    add_meta_to_prompt: false
    obs_length: 1
    obs_interval: 1
    action_length: 10

    train_datasets:
      batch_size: 16
      sources:
        vlabench_choice:
          weight: 1.0
      transforms:
        - type: ComposeState
          reversed_data_flow:
            state:
              proprio_direct: [0, 7]
              action_padding: [7, 32]

        - type: ComposeAction
          use_ideal_length: true
          reversed_data_flow:
            action:
              action_direct_norm: [0, 7]
              action_padding: [7, 32]
              action_mask_key: action_mask

        - type: VLMProcessor
          model: Qwen/Qwen3-VL-4B-Instruct
          enable_l1: false
          enable_choice: true

        - type: Collect
          patterns: [state, action, action_mask, vlm*]

