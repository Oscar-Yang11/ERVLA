# @package _global_

defaults:
  - sources/calvin

data:
  type: BaseDataModule
  params:
    type: stream # [stream, json], json is only available while no vlm data existing.
    max_steps: ${trainer.max_steps}
    add_meta_to_prompt: false
    obs_length: 1
    obs_interval: 1
    action_length: 10

    train_datasets:
      batch_size: 16
      sources:
        calvin_abc_orig:
          weight: 1.0
      transforms:
        - type: ComposeState
          reversed_data_flow:
            state:
              proprio_direct: [0, 7]
              proprio_padding: [7, 32]
        - type: ComposeAction
          reversed_data_flow:
            action:
              action_direct: [0, 7]
              action_padding: [7, 32]
              action_mask_key: action_mask
        - type: VLMProcessor
          model: Qwen/Qwen3-VL-4B-Instruct
          enable_l1: false
        - type: Collect
          patterns: [action, action_mask, state, vlm*]

    val_datasets:
      batch_size: 16
      sources:
        calvin_abc_orig:
          weight: 1.0
      transforms:
        - type: ComposeState
          reversed_data_flow:
            state:
              proprio_direct: [0, 7]
              proprio_padding: [7, 32]
        - type: ComposeAction
          reversed_data_flow:
            action:
              action_direct: [0, 7]
              action_padding: [7, 32]
              action_mask_key: action_mask
        - type: VLMProcessor
          model: Qwen/Qwen3-VL-4B-Instruct
          enable_l1: false
        - type: Collect
          patterns: [action, action_mask, state, vlm*]
