fractal_pt_v4:
  train_path:
    - data/mds/fractal20220817_data/v1/2025-11-17-ori-view-0/train/index.json
  meta_info: "Dataset: Fractal. Robot: Single arm. Camera: Ego camera. Frequency: 3hz."
  transforms:
    training:
      - type: LoadData
        meta_info: ${sources.fractal_pt_v4.meta_info}
        dataset_action_length: 3
        general_task_prob: 0.0
        subtask_task_prob: 1.0
      - type: Resize
        max_pixels: 90000
        factor: 32
        data_flow:
          media: media
      - type: RandomCrop
        crop_ratio: 0.95
        center_crop: false
        data_flow:
          media: media
      - type: PhotoMetricDistortion
        data_flow:
          media: media
      - type: GetEEActionPos
        reversed_data_flow:
          action_left_ee_pos: [proprios.left_ee_rotm, proprios.left_ee_pos, actions.left_ee_pos]
      - type: GetEEActionAA
        reversed_data_flow:
          action_left_ee_aa: [proprios.left_ee_rotm, actions.left_ee_rotm]
      - type: GetAbsAction
        data_flow:
          actions.left_gripper_pos_direct: action_left_gripper_pos_direct
      - type: GetAbsState
        data_flow:
          proprios.left_gripper_pos: proprio_left_gripper_pos
      - type: Normalize
        mode: quantile
        q01: ${sources.fractal_pt_v4.q01}
        q99: ${sources.fractal_pt_v4.q99}
        data_flow:
          proprio_left_gripper_pos: proprio_left_gripper_pos_qn
          action_left_ee_pos: action_left_ee_pos_qn
          action_left_ee_aa: action_left_ee_aa_qn
          action_left_gripper_pos_direct: action_left_gripper_pos_direct_qn
      - type: Normalize
        mode: gaussian
        mean: ${sources.fractal_pt_v4.mean}
        std: ${sources.fractal_pt_v4.std}
        data_flow:
          action_left_ee_pos: action_left_ee_pos_gn
          action_left_ee_aa: action_left_ee_aa_gn
          action_left_gripper_pos_direct: action_left_gripper_pos_direct_gn

