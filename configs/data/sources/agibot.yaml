agibot_pt_v3:
  train_path:
    - data/mds/agibot/2025-12-21_downsample500/train/index.json
  val_path:
    - data/mds/agibot/2025-12-21_downsample500/val/index.json
  meta_info: ${sources.agibot_pt.meta_info}

  transforms:
    training:
      - type: LoadData
        meta_info: ${sources.agibot_pt_v3.meta_info}
        dataset_action_length: 30
        general_task_prob: 0.0
        subtask_task_prob: 1.0
      - type: Resize
        max_pixels: 90000
        factor: 32
        data_flow:
          media: media
      - type: RandomCrop
        crop_ratio: 0.95
        center_crop: false
        data_flow:
          media: media
      - type: PhotoMetricDistortion
        data_flow:
          media: media
      - type: GetAbsAction
        data_flow:
          actions.left_gripper_pos_direct: action_left_gripper_pos_direct
          actions.right_gripper_pos_direct: action_right_gripper_pos_direct
      - type: GetEEActionPos
        reversed_data_flow:
          action_left_ee_pos: [proprios.left_ee_rotm, proprios.left_ee_pos, actions.left_ee_pos]
          action_right_ee_pos: [proprios.right_ee_rotm, proprios.right_ee_pos, actions.right_ee_pos]
      - type: GetEEActionAA
        reversed_data_flow:
          action_left_ee_aa: [proprios.left_ee_rotm, actions.left_ee_rotm]
          action_right_ee_aa: [proprios.right_ee_rotm, actions.right_ee_rotm]
      - type: GetJointAction
        reversed_data_flow:
          action_left_arm_joint: [proprios.left_arm_joint, actions.left_arm_joint]
          action_right_arm_joint: [proprios.right_arm_joint, actions.right_arm_joint]
      - type: GetAbsState
        data_flow:
          proprios.left_gripper_pos: proprio_left_gripper_pos
          proprios.left_arm_joint: proprio_left_arm_joint
          proprios.right_gripper_pos: proprio_right_gripper_pos
          proprios.right_arm_joint: proprio_right_arm_joint
      - type: Normalize
        mode: gaussian
        mean: ${sources.agibot_pt_v3.mean_ee}
        std: ${sources.agibot_pt_v3.std_ee}
        data_flow:
          action_left_ee_pos: action_left_ee_pos
          action_left_ee_aa: action_left_ee_aa
          action_left_gripper_pos_direct: action_left_gripper_pos
          action_left_arm_joint: action_left_arm_joint
          action_right_ee_pos: action_right_ee_pos
          action_right_ee_aa: action_right_ee_aa
          action_right_gripper_pos_direct: action_right_gripper_pos
          action_right_arm_joint: action_right_arm_joint
      - type: Normalize
        mode: quantile
        q01: ${sources.agibot_pt_v3.q01}
        q99: ${sources.agibot_pt_v3.q99}
        data_flow:
          proprio_left_gripper_pos: proprio_left_gripper_pos
          proprio_left_arm_joint: proprio_left_arm_joint
          proprio_right_gripper_pos: proprio_right_gripper_pos
          proprio_right_arm_joint: proprio_right_arm_joint

    validation:
      - type: LoadData
        meta_info: ${sources.agibot_pt_v3.meta_info}
        dataset_action_length: 30
        general_task_prob: 0.0
        subtask_task_prob: 1.0
      - type: Resize
        max_pixels: 90000
        factor: 32
        data_flow:
          media: media
      - type: RandomCrop
        crop_ratio: 0.95
        center_crop: true
        data_flow:
          media: media
      - type: GetAbsAction
        data_flow:
          actions.left_gripper_pos_direct: action_left_gripper_pos_direct
          actions.right_gripper_pos_direct: action_right_gripper_pos_direct
      - type: GetEEActionPos
        reversed_data_flow:
          action_left_ee_pos: [proprios.left_ee_rotm, proprios.left_ee_pos, actions.left_ee_pos]
          action_right_ee_pos: [proprios.right_ee_rotm, proprios.right_ee_pos, actions.right_ee_pos]
      - type: GetEEActionAA
        reversed_data_flow:
          action_left_ee_aa: [proprios.left_ee_rotm, actions.left_ee_rotm]
          action_right_ee_aa: [proprios.right_ee_rotm, actions.right_ee_rotm]
      - type: GetJointAction
        reversed_data_flow:
          action_left_arm_joint: [proprios.left_arm_joint, actions.left_arm_joint]
          action_right_arm_joint: [proprios.right_arm_joint, actions.right_arm_joint]
      - type: GetAbsState
        data_flow:
          proprios.left_gripper_pos: proprio_left_gripper_pos
          proprios.left_arm_joint: proprio_left_arm_joint
          proprios.right_gripper_pos: proprio_right_gripper_pos
          proprios.right_arm_joint: proprio_right_arm_joint
      - type: Normalize
        mode: gaussian
        mean: ${sources.agibot_pt_v3.mean_ee}
        std: ${sources.agibot_pt_v3.std_ee}
        data_flow:
          action_left_ee_pos: action_left_ee_pos
          action_left_ee_aa: action_left_ee_aa
          action_left_gripper_pos_direct: action_left_gripper_pos
          action_left_arm_joint: action_left_arm_joint
          action_right_ee_pos: action_right_ee_pos
          action_right_ee_aa: action_right_ee_aa
          action_right_gripper_pos_direct: action_right_gripper_pos
          action_right_arm_joint: action_right_arm_joint
      - type: Normalize
        mode: quantile
        q01: ${sources.agibot_pt_v3.q01}
        q99: ${sources.agibot_pt_v3.q99}
        data_flow:
          proprio_left_gripper_pos: proprio_left_gripper_pos
