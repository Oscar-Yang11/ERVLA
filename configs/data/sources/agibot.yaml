agibot_pt_v4:
  train_path:
    - data/agibot-beta/v1/2026-03-15_downsample1000/train/data/
  val_path:
    - data/mds/agibot-beta/v1/2026-03-15_downsample1000/val/index.json
  meta_info: "Dataset: AgiBot. Robot: Dual arm. Camera: Ego camera + 2 x Wrist camera. Frequency: 30hz."
  transforms:
    training:
      - type: LoadData
        meta_info: ${sources.agibot_pt_v4.meta_info}
        dataset_action_length: 30
        general_task_prob: 0.0
        subtask_task_prob: 1.0
      - type: Resize
        max_pixels: 90000
        factor: 32
        data_flow:
          media: media
      - type: RandomCrop
        crop_ratio: 0.95
        center_crop: false
        data_flow:
          media: media
      - type: PhotoMetricDistortion
        data_flow:
          media: media
      - type: GetEEActionPos
        reversed_data_flow:
          action_left_ee_pos: [proprios.left_ee_rotm, proprios.left_ee_pos, actions.left_ee_pos]
          action_right_ee_pos: [proprios.right_ee_rotm, proprios.right_ee_pos, actions.right_ee_pos]
      - type: GetEEActionAA
        reversed_data_flow:
          action_left_ee_aa: [proprios.left_ee_rotm, actions.left_ee_rotm]
          action_right_ee_aa: [proprios.right_ee_rotm, actions.right_ee_rotm]
      - type: GetAbsAction
        data_flow:
          actions.left_gripper_pos_direct: action_left_gripper_pos_direct
          actions.right_gripper_pos_direct: action_right_gripper_pos_direct
      - type: GetAbsState
        data_flow:
          proprios.left_gripper_pos: proprio_left_gripper_pos
          proprios.right_gripper_pos: proprio_right_gripper_pos
      - type: Normalize
        mode: quantile
        q01: ${sources.agibot_pt_v4.q01}
        q99: ${sources.agibot_pt_v4.q99}
        data_flow:
          proprio_left_gripper_pos: proprio_left_gripper_pos_qn
          proprio_right_gripper_pos: proprio_right_gripper_pos_qn
          action_left_ee_pos: action_left_ee_pos_qn
          action_left_ee_aa: action_left_ee_aa_qn
          action_left_gripper_pos_direct: action_left_gripper_pos_direct_qn
          action_right_ee_pos: action_right_ee_pos_qn
          action_right_ee_aa: action_right_ee_aa_qn
          action_right_gripper_pos_direct: action_right_gripper_pos_direct_qn
      - type: Normalize
        mode: gaussian
        mean: ${sources.agibot_pt_v4.mean}
        std: ${sources.agibot_pt_v4.std}
        data_flow:
          action_left_ee_pos: action_left_ee_pos_gn
          action_left_ee_aa: action_left_ee_aa_gn
          action_left_gripper_pos_direct: action_left_gripper_pos_direct_gn
          action_right_ee_pos: action_right_ee_pos_gn
          action_right_ee_aa: action_right_ee_aa_gn
          action_right_gripper_pos_direct: action_right_gripper_pos_direct_gn
    validation:
      - type: LoadData
        meta_info: ${sources.agibot_pt_v4.meta_info}
        dataset_action_length: 30
        general_task_prob: 0.0
        subtask_task_prob: 1.0
      - type: Resize
        max_pixels: 90000
        factor: 32
        data_flow:
          media: media
      - type: RandomCrop
        crop_ratio: 0.95
        center_crop: true
        data_flow:
          media: media
      - type: GetEEActionPos
        reversed_data_flow:
          action_left_ee_pos: [proprios.left_ee_rotm, proprios.left_ee_pos, actions.left_ee_pos]
          action_right_ee_pos: [proprios.right_ee_rotm, proprios.right_ee_pos, actions.right_ee_pos]
      - type: GetEEActionAA
        reversed_data_flow:
          action_left_ee_aa: [proprios.left_ee_rotm, actions.left_ee_rotm]
          action_right_ee_aa: [proprios.right_ee_rotm, actions.right_ee_rotm]
      - type: GetAbsAction
        data_flow:
          actions.left_gripper_pos_direct: action_left_gripper_pos_direct
          actions.right_gripper_pos_direct: action_right_gripper_pos_direct
      - type: GetAbsState
        data_flow:
          proprios.left_gripper_pos: proprio_left_gripper_pos
          proprios.right_gripper_pos: proprio_right_gripper_pos
      - type: Normalize
        mode: quantile
        q01: ${sources.agibot_pt_v4.q01}
        q99: ${sources.agibot_pt_v4.q99}
        data_flow:
          proprio_left_gripper_pos: proprio_left_gripper_pos_qn
          proprio_right_gripper_pos: proprio_right_gripper_pos_qn
          action_left_ee_pos: action_left_ee_pos_qn
          action_left_ee_aa: action_left_ee_aa_qn
          action_left_gripper_pos_direct: action_left_gripper_pos_direct_qn
          action_right_ee_pos: action_right_ee_pos_qn
          action_right_ee_aa: action_right_ee_aa_qn
          action_right_gripper_pos_direct: action_right_gripper_pos_direct_qn
      - type: Normalize
