calvin_abc_orig:
  train_path:
    - data/calvin_abc_trimmed/rel/2025-11-12/training/data/
  val_path:
    - data/calvin_abc/rel/2025-11-12/validation/data/
  meta_info: "Dataset: Calvin."

  transforms:
    training:
      - type: LoadData
        dataset_action_length: 10
        general_task_prob: 0.0
        subtask_task_prob: 1.0
      - type: Resize
        max_pixels: 90000
        factor: 32
        data_flow:
          media: media
      - type: RandomCrop
        crop_ratio: 0.95
        center_crop: false
        data_flow:
          media: media
      - type: GetAbsAction
        padding_action: [0, 0, 0, 0, 0, 0, 1]
        data_flow:
          actions.direct: action_direct
      - type: GetAbsState
        data_flow:
          proprios.direct: proprio_direct
      - type: Normalize
        mode: gaussian
        mean: ${sources.calvin_abc_orig.mean}
        std: ${sources.calvin_abc_orig.std}
        data_flow:
          action_direct: action_direct
    
    validation:
      - type: LoadData
        dataset_action_length: 10
        general_task_prob: 0.0
        subtask_task_prob: 1.0
      - type: Resize
        max_pixels: 90000
        factor: 32
        data_flow:
          media: media
      - type: RandomCrop
        crop_ratio: 0.95
        center_crop: true
        data_flow:
          media: media
      - type: GetAbsAction
        padding_action: [0, 0, 0, 0, 0, 0, 1]
        data_flow:
          actions.direct: action_direct
      - type: GetAbsState
        data_flow:
          proprios.direct: proprio_direct
      - type: Normalize
        mode: gaussian
        mean: ${sources.calvin_abc_orig.mean}
        std: ${sources.calvin_abc_orig.std}
        data_flow:
          action_direct: action_direct

  mean:
