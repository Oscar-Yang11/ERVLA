molmoact_pt:
  train_path:
    - data/mds/molmoact/2025-10-28-view-1_recompute-gripper-direct/train/index.json
  meta_info: "Dataset: MolmoAct."

  transforms:
    training:
      - type: LoadData
        meta_info: ${sources.molmoact_pt.meta_info}
        dataset_action_length: 15
        general_task_prob: 0.0
        subtask_task_prob: 1.0
      - type: Resize
        max_pixels: 90000
        factor: 32
        data_flow:
          media: media
      - type: RandomCrop
        crop_ratio: 0.95
        center_crop: false
        data_flow:
          media: media
      - type: PhotoMetricDistortion
        data_flow:
          media: media
      - type: GetAbsAction
        data_flow:
          actions.left_gripper_pos_direct: action_left_gripper_pos_direct
      - type: GetEEActionPos
        reversed_data_flow:
          action_left_ee_pos: [proprios.left_ee_rotm, proprios.left_ee_pos, actions.left_ee_pos]
      - type: GetEEActionAA
        reversed_data_flow:
          action_left_ee_aa: [proprios.left_ee_rotm, actions.left_ee_rotm]
      - type: GetAbsState
        data_flow:
          proprios.left_gripper_pos: proprio_left_gripper_pos
      - type: Normalize
        mode: gaussian
        mean: ${sources.molmoact_pt.mean_ee}
        std: ${sources.molmoact_pt.std_ee}
        data_flow:
          action_left_ee_pos: action_left_ee_pos
          action_left_ee_aa: action_left_ee_aa
          action_left_gripper_pos_direct: action_left_gripper_pos
      - type: Normalize
        mode: quantile
        q01: ${sources.molmoact_pt.q01}
        q99: ${sources.molmoact_pt.q99}
        data_flow:
          proprio_left_gripper_pos: proprio_left_gripper_pos

